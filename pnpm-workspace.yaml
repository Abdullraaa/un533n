allowBuilds:
  bcrypt: true
  # watch-mode only; the prebuilt @parcel/watcher-linux-x64-glibc package covers it
  "@parcel/watcher": false
  # jest-resolve's native resolver; the prebuilt @unrs/resolver-binding-* package
  # covers it, so the build script only needs suppressing, not running
  unrs-resolver: false
